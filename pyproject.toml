[project]
name = "rf433-sensor-manager"
version = "0.1.1"
requires-python = ">=3.14.2"

[dependency-groups]
test = ["homeassistant>=2026.6.0", "pytest-homeassistant-custom-component>=0.13.300", "pytest>=8.0", "ruff>=0.12", "mypy>=1.15"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
